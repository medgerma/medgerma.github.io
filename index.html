<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MEDGERMA Games</title>
<meta name="description" content="BoltSort: Nuts & Bolts Sort, a relaxing color puzzle game by MEDGERMA.">
<link rel="icon" href="icon.png">
<style>
  :root { --bg1:#4a86c0; --bg2:#23497f; --card:#ffffff; --text:#1d2633; --muted:#5b6778; --green:#00c853; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:linear-gradient(180deg,var(--bg1),var(--bg2)); color:#fff;
         font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic",sans-serif; }
  main { max-width:720px; margin:0 auto; padding:48px 16px 32px; text-align:center; }
  .brand { letter-spacing:.2em; font-size:13px; opacity:.8; margin:0 0 32px; }
  .card { background:var(--card); color:var(--text); border-radius:24px; padding:32px 24px; box-shadow:0 20px 50px rgba(0,0,0,.25); }
  .card img { width:128px; height:128px; border-radius:28px; box-shadow:0 8px 20px rgba(0,0,0,.2); }
  h1 { margin:20px 0 4px; font-size:28px; }
  .tag { color:var(--muted); margin:0 0 6px; }
  .tag-ar { color:var(--muted); margin:0 0 24px; direction:rtl; }
  .btn { display:inline-block; background:var(--green); color:#fff; text-decoration:none; font-weight:700;
         padding:14px 28px; border-radius:14px; border:3px solid #fff; box-shadow:0 4px 0 #0a8f3d; }
  .btn:hover { filter:brightness(1.05); }
  footer { margin-top:32px; font-size:14px; opacity:.9; }
  footer a { color:#fff; }
  footer p { margin:6px 0; }
</style>
</head>
<body>
<main>
  <p class="brand">MEDGERMA</p>

  <div class="card">
    <img src="icon.png" alt="BoltSort icon">
    <h1>BoltSort: Nuts &amp; Bolts Sort</h1>
    <p class="tag">Sort the colorful nuts onto the bolts! A fun, relaxing color puzzle.</p>
    <p class="tag-ar">رتّب الصواميل الملونة على البراغي! لعبة ألغاز ممتعة ومريحة.</p>
    <a class="btn" href="https://play.google.com/store/apps/details?id=com.medgerma.boltsort">Get it on Google Play</a>
  </div>

  <footer>
    <p><a href="https://docs.google.com/document/d/e/2PACX-1vT-FCfMPkDKQK-Zf6m7NXNoIlXbltubnat1XZfwYIKRDf-pkVudEAzvrTd5ZCqzifUJFy2wqhgNaUc2/pub">Privacy Policy · سياسة الخصوصية</a></p>
    <p>Contact: <a href="mailto:medgerma903@gmail.com">medgerma903@gmail.com</a></p>
    <p>© 2026 MEDGERMA</p>
  </footer>
</main>
</body>
</html>
